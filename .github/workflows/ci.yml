name: Go quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Race test
        run: go test -race ./...

      - name: Run local example
        run: test "$(go run ./examples/local-runtime)" = "hello"

      - name: Run cluster example
        run: test "$(go run ./examples/cluster-runtime)" = "hello cluster"

      - name: Run discovery example
        run: test "$(go run ./examples/discovery-runtime)" = ".config -> node-b/2"

      - name: Run monitor example
        run: go run ./examples/monitor-runtime

      - name: Run snapshot example
        run: test "$(go run ./examples/snapshot-runtime)" = "2"
